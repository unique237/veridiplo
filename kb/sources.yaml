# VeriDiplo knowledge base — source catalogue (updated 10 Nov 2026)
# RULES: real public documents only. Never invent text, articles or URLs.
#
# Fields
#   id, title, jurisdiction, binding, nodes (Y.3172 nodes), topics (coarse fallback tags)
#   issuer, date (ISO date of the instrument), lang (fr|en)
#   kind: primary (default) | summary      -> summary = text comes from a secondary/overview page
#   primary_url      : full-text URL (tried first)           fallback_urls: tried only if primary fails -> kind becomes summary
#   secondary_urls   : citations; they are FETCHED only when kind: summary
#   local_file       : human drop-in in kb/raw/ (e.g. kb/raw/CM-HE-2023.pdf) -> takes priority over any URL
#   extract          : {ocr: auto|force|never, selector: CSS, junk_lines: [regex], format: pdf|html|json}
#   chunking         : {mode: article|tokens|headings|dimensions, articles_keep: [..], section_as_article: bool,
#                       article_regex, preamble: keep|skip, include_sections: [regex], max_chunks, max_chars}
#   anchors          : {name: regex | {article: "Art. N", pattern: regex}} -> kb/chunks/anchors.json
#                      (an anchor is only created if the regex matches the text of a real chunk)
#   licence, redistribute (false => kb/raw is git-ignored; chunks are short excerpts with citation)
#   status (declared; the build prints/writes the ACTUAL status): downloaded | summary_only | pending_download | pending_ocr
#   as_reported: true marks article numbers taken from secondary sources.
#   verify: true -> details found via secondary sources; confirm before relying on them
#
# Statuses below were set after the real download run of 10 Nov 2026 (see kb/raw/MANIFEST.json).

sources:
  # ---------------- Cameroon: data, cyber, digital ----------------
  - id: CM-DP-2024
    title: "Loi n° 2024/017 du 23 décembre 2024 relative à la protection des données à caractère personnel au Cameroun"
    jurisdiction: CM
    binding: true
    issuer: "Présidence de la République du Cameroun"
    date: "2024-12-23"
    lang: fr
    nodes: [SRC, C, PP, P, SINK]
    topics: [consent, minimisation, cross_border, security, rights, authority]
    primary_url: https://www.digitalbusiness.africa/wp-content/uploads/2024/12/1055fa3c2251b4c4248fd301f584daaf.pdf
    secondary_urls:
      - https://lexafrica.com/2025/10/cameroon-data-protection-law-compliance/
      - https://www.dlapiperdataprotection.com/?c=CM&t=law
      - https://techhiveadvisory.africa/insights/operationalising-cameroons-data-protection-law-a-review-of-key-provisions-and-impacts
      - https://www.afriwise.com/resources/cameroons-evolving-data-privacy-landscape
    extract: {ocr: force, ocr_threshold: 140, junk_lines: ['PRESID|REPUBLIQUE|SECRETARIAT|SERVICE DU FICHIER|CARD INDEX|COPIE CERTIFI|CERTIFIED TRUE|LEGISLATIVE AND STATUTORY|COPIE CER|TRUE COPY|^[A-Za-z]{1,2}$']}
    chunking: {mode: article}
    anchors: {consent: {article: "Art. 9", pattern: 'consentement\s+préalable,\s*libre'}, consent_required: {article: "Art. 50", pattern: 'consentement\s+préalable.{0,60}interdit'}, purpose: {article: "Art. 11", pattern: 'finalités\s+déterminées'}, accuracy: {article: "Art. 12", pattern: 'complètes,\s*fiables'}, retention: {article: "Art. 13", pattern: 'n.excède\s+pas\s+la\s+période'}, retention_max: {article: "Art. 28", pattern: 'délai\s+maximum\s+de\s+conservation'}, security: {article: "Art. 27", pattern: 'identité\s+des\s+tiers'}, minimisation: {article: "Art. 36", pattern: 'principe\s+de\s+minimisation'}, accountability_register: {article: "Art. 29", pattern: 'registre\s+physique'}, transfer: {article: "Art. 32", pattern: 'autorisation\s+préalable'}, automated_decision: {article: "Art. 44", pattern: 'exclusivement\s+sur\s+le\s+traitement\s+automatisé'}, human_intervention: {article: "Art. 44", pattern: 'intervention\s+humaine'}, authority: {article: "Art. 53", pattern: 'organisme\s+public\s+indépendant'}, remedy: {article: "Art. 62", pattern: 'réparation'}}
    licence: "Official legislative text (public). Copy is the 'certified true copy' of the Presidency (prc.cm watermark) republished by digitalbusiness.africa; scanned PDF -> OCR."
    redistribute: true
    notes: "REAL TEXT via OCR of the Presidency's certified copy (scanned PDF, watermark). Article numbers are those of the text itself (as_reported: false), but OCR errors are possible: check against the official Journal officiel before legal use. Secondary sources (lexafrica, DLA Piper, TechHive, Afriwise) report Art. 19/22/27/32/53 — compare with chunks."
    status: downloaded
    raw_file: CM-DP-2024.pdf
    chunks: 80

