name: veridiplo

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-veridiplo}:${POSTGRES_PASSWORD:-veridiplo}@db:5432/${POSTGRES_DB:-veridiplo}
  KG_URL: http://kg:7878
  KB_DIR: /app/kb
  DATA_DIR: /app/data
  POLICY_MODE: ${POLICY_MODE:-on}
  LLM_PROVIDER: ${LLM_PROVIDER:-none}
  OLLAMA_URL: http://ollama:11434
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b-instruct}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  SEED: ${SEED:-42}
  EMBED_MODEL: ${EMBED_MODEL:-intfloat/multilingual-e5-small}

x-app-build: &app-build
  context: .
  dockerfile: docker/Dockerfile.app
  args:
    APP_UID: ${APP_UID:-1000}

x-app-volumes: &app-volumes
  - ./app:/app/app
  - ./scripts:/app/scripts
  - ./tests:/app/tests
  - ./data_gen:/app/data_gen
  - ./data:/app/data
  - ./kb:/app/kb
  - ./docs:/app/docs
  - hf_cache:/home/app/.cache/huggingface

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-veridiplo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veridiplo}
      POSTGRES_DB: ${POSTGRES_DB:-veridiplo}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  kg:
    image: ghcr.io/oxigraph/oxigraph:latest
    command: ["serve", "--location", "/data", "--bind", "0.0.0.0:7878"]
    volumes:
      - kgdata:/data
    ports:
      - "${KG_PORT:-7878}:7878"
    restart: unless-stopped

  api:
    build: *app-build
    image: veridiplo-app:dev
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    environment: *app-env
    volumes: *app-volumes
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      kg:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 6s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  worker:
    build: *app-build
    image: veridiplo-app:dev
    command: ["python", "-m", "app.worker"]
    environment: *app-env
    volumes: *app-volumes
    depends_on:
      db:
        condition: service_healthy
      kg:
        condition: service_started
      api:
        condition: service_healthy
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
      args:
        APP_UID: ${APP_UID:-1000}
    image: veridiplo-ui:dev
    environment:
      API_URL: http://api:8000
      UI_DEFAULT_LANG: ${UI_DEFAULT_LANG:-fr}
    volumes:
      - ./ui:/app/ui
    ports:
      - "${UI_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 6s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: [llm]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    restart: unless-stopped

volumes:
  pgdata:
  kgdata:
  hf_cache:
  ollama_data:
